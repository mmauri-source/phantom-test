<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El test de Phantom · Phantom’s test</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#f3f6fb; --card:#ffffff; --ink:#14223b; --muted:#5a6b85; --line:#cdd7e6;
  --accent:#0f766e; --accent-ink:#ffffff; --sel:#e3f3f1; --ok:#1f7a4a; --okbg:#e7f6ee; --bad:#b3202a; --badbg:#fdeaec; --gold:#f2c14e;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0c1524; --card:#142238; --ink:#eaf1fb; --muted:#9db0cc; --line:#2a3d5c;
    --accent:#2dd4bf; --accent-ink:#06201d; --sel:#173a3b; --ok:#5ee09a; --okbg:#123626; --bad:#ff7b86; --badbg:#3a1820; --gold:#f2c14e;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0c1524; --card:#142238; --ink:#eaf1fb; --muted:#9db0cc; --line:#2a3d5c;
  --accent:#2dd4bf; --accent-ink:#06201d; --sel:#173a3b; --ok:#5ee09a; --okbg:#123626; --bad:#ff7b86; --badbg:#3a1820; --gold:#f2c14e;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
h1{font-size:1.35rem;margin:0}
.lang{display:flex;gap:6px}
.lang button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-weight:700;cursor:pointer;min-height:40px}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.intro{color:var(--muted);margin:4px 0 16px}
.q{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;margin:0 0 14px}
.q.bad{border-color:var(--bad);background:var(--badbg)}
.q h2{font-size:1.02rem;margin:0 0 10px;display:flex;gap:10px}
.q h2 .n{flex:none;width:1.9em;height:1.9em;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.9rem}
.opt{display:block;margin:8px 0}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt span{display:block;padding:12px 14px;border:2px solid var(--line);border-radius:10px;cursor:pointer;min-height:48px}
.opt input:checked + span{border-color:var(--accent);background:var(--sel);font-weight:600}
.opt input:focus-visible + span{outline:3px solid var(--gold);outline-offset:2px}
.flag{display:none;color:var(--bad);font-weight:700;margin-top:6px;font-size:.92rem}
.q.bad .flag{display:block}
.go{width:100%;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-size:1.08rem;font-weight:800;padding:14px;cursor:pointer;min-height:52px}
.result{margin-top:16px;border-radius:14px;padding:16px;display:none;text-align:center}
.result.show{display:block}
.result.ok{background:var(--okbg);border:2px solid var(--ok);color:var(--ink)}
.result.no{background:var(--badbg);border:2px solid var(--bad);color:var(--ink)}
.big{font-size:4.2rem;font-weight:900;color:var(--ok);line-height:1;margin:6px 0}
.small{color:var(--muted);font-size:.92rem}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <div class="lang" role="group" aria-label="Idioma / Language">
      <button type="button" data-l="es" aria-pressed="true">ES</button>
      <button type="button" data-l="en" aria-pressed="false">EN</button>
    </div>
  </header>
  <p class="intro" id="intro"></p>
  <div id="quiz"></div>
  <button class="go" id="check" type="button"></button>
  <div class="result" id="result" role="status" aria-live="polite"></div>
</div>
<script>
(function(){
  var T={
    es:{title:"El test de Phantom",
      intro:"Phantom asegura que nadie cuida el planeta digital. Responded a las 6 preguntas. Si acertáis todas, la página os dará el segundo número del código.",
      check:"Comprobar respuestas",
      pending:"Faltan preguntas por responder: marcad una opción en cada una.",
      okTitle:"¡Todo correcto! Phantom está impresionado.",
      okText:"El segundo número del código es:",
      okNote:"Apuntadlo en vuestra hoja de ruta.",
      noTitle:function(k,n){return "Lleváis "+k+" de "+n+" bien."},
      noText:"Revisad las preguntas marcadas en rojo y volved a probar.",
      flag:"Revisad esta pregunta"},
    en:{title:"Phantom’s test",
      intro:"Phantom claims that nobody looks after the digital planet. Answer the 6 questions. If you get them all right, the page will give you the second number of the code.",
      check:"Check answers",
      pending:"Some questions are unanswered: pick one option in each.",
      okTitle:"All correct! Phantom is impressed.",
      okText:"The second number of the code is:",
      okNote:"Write it on your route sheet.",
      noTitle:function(k,n){return "You have "+k+" out of "+n+" right."},
      noText:"Review the questions marked in red and try again.",
      flag:"Review this question"}
  };
  var Q=[
    {a:0,es:{q:"Un aparato está encendido, pero nadie lo usa, y sigue gastando energía. ¿Cómo se llama ese consumo?",o:["Consumo en espera (standby)","Consumo solar","Consumo cuántico"]},
         en:{q:"A device is switched on but nobody uses it, and it keeps using energy. What is that consumption called?",o:["Standby consumption","Solar consumption","Quantum consumption"]}},
    {a:2,es:{q:"¿Qué ayuda más a reducir la huella ambiental de tu móvil?",o:["Cambiarlo cada año por uno nuevo","Comprar siempre el modelo más caro","Repararlo y usarlo durante más años"]},
         en:{q:"What helps most to reduce your phone’s environmental footprint?",o:["Replacing it every year with a new one","Always buying the most expensive model","Repairing it and using it for more years"]}},
    {a:1,es:{q:"Tienes que enviar un archivo pesado a 30 personas. ¿Qué es mejor?",o:["Mandárselo por correo a cada una","Compartir un enlace","Imprimirlo y repartirlo"]},
         en:{q:"You have to send a heavy file to 30 people. What is better?",o:["Email it to each one","Share a link","Print it and hand it out"]}},
    {a:2,es:{q:"¿Dónde se guardan físicamente los archivos de «la nube»?",o:["En el aire","Solo en tu móvil","En centros de datos, con servidores que consumen energía"]},
         en:{q:"Where are the files of “the cloud” physically stored?",o:["In the air","Only on your phone","In data centres, with servers that use energy"]}},
    {a:0,es:{q:"¿Qué se debe hacer con un móvil viejo que ya no usas?",o:["Llevarlo a un punto de recogida de residuos electrónicos","Tirarlo a la basura normal","Dejarlo en un cajón para siempre"]},
         en:{q:"What should you do with an old phone you no longer use?",o:["Take it to an electronic waste collection point","Throw it in the normal bin","Leave it in a drawer forever"]}},
    {a:0,es:{q:"Verdadero o falso: cada vez que una IA genera un texto o una imagen, usa energía en servidores.",o:["Verdadero","Falso"]},
         en:{q:"True or false: every time an AI generates a text or an image, it uses energy in servers.",o:["True","False"]}}
  ];
  var CODE=atob("Mw==");
  var lang="es", sel=[], bad=[], shown=false;
  var $=function(id){return document.getElementById(id)};
  function render(){
    var t=T[lang];
    document.documentElement.lang=lang;
    $("title").textContent=t.title; $("intro").textContent=t.intro; $("check").textContent=t.check;
    var h="";
    Q.forEach(function(q,i){
      var d=q[lang];
      h+='<div class="q'+(bad.indexOf(i)>-1?' bad':'')+'" id="q'+i+'"><h2><span class="n">'+(i+1)+'</span><span>'+d.q+'</span></h2>';
      d.o.forEach(function(o,j){
        h+='<label class="opt"><input type="radio" name="q'+i+'" value="'+j+'"'+(sel[i]===j?' checked':'')+'><span>'+o+'</span></label>';
      });
      h+='<div class="flag">'+t.flag+'</div></div>';
    });
    $("quiz").innerHTML=h;
    Array.prototype.forEach.call(document.querySelectorAll('#quiz input'),function(inp){
      inp.addEventListener("change",function(){
        var i=+inp.name.slice(1); sel[i]=+inp.value;
        var el=$("q"+i); el.classList.remove("bad"); bad=bad.filter(function(x){return x!==i});
      });
    });
    if(shown) showResult(true);
  }
  function showResult(keep){
    var t=T[lang], r=$("result"), n=Q.length, k=0; bad=[];
    var missing=false;
    Q.forEach(function(q,i){
      if(sel[i]===undefined){missing=true}
      else if(sel[i]===q.a){k++}
      else{bad.push(i)}
    });
    if(missing){
      r.className="result show no"; r.innerHTML='<strong>'+t.pending+'</strong>'; shown=false;
      Q.forEach(function(q,i){ if(sel[i]===undefined){var el=$("q"+i); if(el)el.classList.add("bad")} });
      return;
    }
    shown=true;
    Q.forEach(function(q,i){ var el=$("q"+i); if(el){ if(bad.indexOf(i)>-1) el.classList.add("bad"); else el.classList.remove("bad"); } });
    if(k===n){
      r.className="result show ok";
      r.innerHTML='<strong>'+t.okTitle+'</strong><p class="small">'+t.okText+'</p><div class="big">'+CODE+'</div><p class="small">'+t.okNote+'</p>';
    }else{
      r.className="result show no";
      r.innerHTML='<strong>'+t.noTitle(k,n)+'</strong><p class="small">'+t.noText+'</p>';
    }
    if(!keep){r.scrollIntoView({behavior:"smooth",block:"nearest"})}
  }
  $("check").addEventListener("click",function(){showResult(false)});
  Array.prototype.forEach.call(document.querySelectorAll(".lang button"),function(b){
    b.addEventListener("click",function(){
      lang=b.getAttribute("data-l");
      Array.prototype.forEach.call(document.querySelectorAll(".lang button"),function(x){x.setAttribute("aria-pressed",x===b?"true":"false")});
      render();
    });
  });
  render();
})();
</script>
</body>
</html>
